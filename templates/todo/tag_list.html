{% extends "base.html" %}

{% block title %}<title>Tags</title>{% endblock %}

{% block content %}
  <div class="page-header">
    <h1>Tags</h1>
    <a href="{% url 'todo:tag-create' %}" class="btn btn-primary">+ Add</a>
  </div>

  {% if tag_list %}
    <table class="data-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Update</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody>
        {% for tag in tag_list %}
          <tr>
            <td>{{ tag.name }}</td>
            <td>
              <a href="{% url 'todo:tag-update' pk=tag.pk %}" class="btn btn-outline btn-sm">Update</a>
            </td>
            <td>
              <a href="{% url 'todo:tag-delete' pk=tag.pk %}" class="btn btn-danger btn-sm">Delete</a>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p class="empty-state">No tags yet.</p>
  {% endif %}
{% endblock %}
